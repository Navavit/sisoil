<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thai Soil Database</title>
  <meta name="description" content="Open soil data for Thailand: measured soil analyses, soil profiles and survey points on one map, with a soil check for any location. ฐานข้อมูลดินไทยจากแหล่งข้อมูลเปิด">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub"><span data-i18n="subtitle"></span> · <span data-i18n="updated"></span> <span id="updated">–</span></p>
    </div>
    <nav class="downloads">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a href="sources.html" class="ghost" data-i18n="sourcesLink"></a>
    </nav>
  </header>

  <section class="stats" id="stats"></section>

  <main class="layout">
    <aside class="filters">
      <h2 data-i18n="layers"></h2>
      <p class="muted small" data-i18n="layersNote"></p>

      <div class="layer">
        <label class="check"><input id="l-osd" type="checkbox" checked> <b data-i18n="layerOsd"></b> <span class="badge badge-used" data-i18n="measured"></span></label>
        <label><span data-i18n="osdYear"></span><select id="osd-year"></select></label>
        <p class="muted small" id="osd-info"></p>
      </div>
      <div class="layer">
        <label class="check"><input id="l-wosis" type="checkbox" checked> <b data-i18n="layerWosis"></b> <span class="badge badge-used" data-i18n="measured"></span></label>
        <p class="muted small" id="wosis-info"></p>
      </div>
      <div class="layer">
        <label class="check"><input id="l-ldd" type="checkbox"> <b data-i18n="layerLdd"></b> <span class="badge badge-planned" data-i18n="classesOnly"></span></label>
        <p class="muted small" id="ldd-info"></p>
        <details>
          <summary data-i18n="filters"></summary>
          <label><span data-i18n="province"></span><select id="f-province"><option value="" data-i18n="all"></option></select></label>
          <label><span data-i18n="ph"></span><select id="f-ph"><option value="" data-i18n="all"></option></select></label>
          <label><span data-i18n="om"></span><select id="f-om"><option value="" data-i18n="all"></option></select></label>
          <label><span data-i18n="p"></span><select id="f-p"><option value="" data-i18n="all"></option></select></label>
          <label><span data-i18n="k"></span><select id="f-k"><option value="" data-i18n="all"></option></select></label>
          <div class="row">
            <label><span data-i18n="yearFrom"></span><input id="f-from" type="number" min="1990" max="2100" placeholder="CE"></label>
            <label><span data-i18n="yearTo"></span><input id="f-to" type="number" min="1990" max="2100" placeholder="CE"></label>
          </div>
          <label><span data-i18n="qa"></span><select id="f-qa"></select></label>
          <label class="check"><input id="f-new" type="checkbox"> <span data-i18n="onlyNew"></span></label>
          <button id="f-reset" type="button" data-i18n="reset"></button>
        </details>
      </div>

      <h3 data-i18n="areaLayers"></h3>
      <label class="check"><input id="l-prov" type="checkbox" checked> <span data-i18n="layerProvince"></span></label>
      <label class="check"><input id="l-admin" type="checkbox"> <span data-i18n="layerAdmin"></span></label>
      <p class="muted small" id="admin-info"></p>
      <label class="check"><input id="l-lc" type="checkbox"> <span data-i18n="layerLandcover"></span></label>
      <div id="lc-opts" hidden>
        <label><span data-i18n="lcYear"></span><select id="lc-year"></select></label>
        <ul class="legend" id="lc-legend"></ul>
        <p class="muted small" data-i18n="lcNote"></p>
      </div>

      <h3 data-i18n="legend"></h3>
      <ul class="legend" id="legend"></ul>
    </aside>
    <div id="map"></div>
  </main>

  <section class="panel" id="check">
    <h2 data-i18n="checkTitle"></h2>
    <p class="muted small" data-i18n="checkIntro"></p>
    <div class="check-form">
      <button type="button" id="check-pick" aria-pressed="false" data-i18n="checkPick"></button>
      <button type="button" id="check-me" data-i18n="checkMe"></button>
      <label><span data-i18n="checkLat"></span><input id="check-lat" inputmode="decimal" placeholder="16.68 หรือ 16.68, 102.86"></label>
      <label><span data-i18n="checkLon"></span><input id="check-lon" inputmode="decimal" placeholder="102.86"></label>
      <label><span data-i18n="checkRadius"></span><select id="check-radius">
        <option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="25">25 km</option>
      </select></label>
      <button type="button" id="check-go" class="primary" data-i18n="checkGo"></button>
    </div>
    <p class="muted small" id="check-msg" aria-live="polite"></p>
    <div id="check-result"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2><span data-i18n="list"></span> <span id="count" class="muted"></span></h2>
      <input id="q" type="search" data-i18n-placeholder="search">
    </div>
    <p class="muted small" id="hidden-note"></p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th data-i18n="surveyDate"></th><th data-i18n="firstSeen"></th><th data-i18n="location"></th>
          <th>pH</th><th>OM</th><th>P</th><th>K</th><th data-i18n="texture"></th><th data-i18n="coords"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="muted small" id="more"></p>
  </section>

  <section class="panel">
    <h2 data-i18n="history"></h2>
    <p class="muted small" data-i18n="historyNote"></p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-i18n="runDate"></th><th data-i18n="total"></th><th data-i18n="added"></th>
          <th data-i18n="removed"></th><th data-i18n="modified"></th><th data-i18n="pending"></th>
        </tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </section>

  <section class="panel small">
    <h2 data-i18n="aboutDates"></h2>
    <ul class="dates-help">
      <li><b data-i18n="surveyDate"></b> — <span data-i18n="surveyDateHelp"></span></li>
      <li><b data-i18n="firstSeen"></b> — <span data-i18n="firstSeenHelp"></span></li>
      <li><b data-i18n="lastSeen"></b> — <span data-i18n="lastSeenHelp"></span></li>
      <li><b data-i18n="detailFetched"></b> — <span data-i18n="detailFetchedHelp"></span></li>
    </ul>
  </section>

  <footer class="muted small"><span data-i18n="footer"></span> · <a href="sources.html" data-i18n="sourcesLink"></a></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="areas.js"></script>
  <script src="check.js"></script>
</body>
</html>
