<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="img/sisoil.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SISoil · ฐานข้อมูลดินไทย</title>
  <meta name="description" content="SISoil ฐานข้อมูลดินไทยจากแหล่งข้อมูลเปิด โดยวิทยาลัยบูรณาการศาสตร์ มหาวิทยาลัยเกษตรศาสตร์: soil profile WoSIS, ผลวิเคราะห์ดินจากห้องแล็บและจุดสำรวจของกรมพัฒนาที่ดิน แผนที่ดิน ขอบเขตปกครอง การใช้ที่ดิน และตรวจดินจากพิกัด — Open soil data for Thailand on one map with a soil check for any location.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="brand-mark" src="img/sisoil.svg" alt="" width="48" height="48">
      <div>
        <h1><span data-i18n="title"></span> <span class="brand-th" data-i18n="brandSub"></span></h1>
        <p class="sub"><span data-i18n="subtitle"></span> · <span data-i18n="updated"></span> <span id="updated">–</span></p>
      </div>
    </div>
    </div>
    <nav class="downloads">
      <span class="logos"><img src="img/logo-ku.png" alt="มหาวิทยาลัยเกษตรศาสตร์ (Kasetsart University)" width="44" height="56"><img src="img/logo-sis.png" alt="วิทยาลัยบูรณาการศาสตร์ (School of Integrated Science)" width="163" height="56"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a href="sources.html" class="ghost" data-i18n="sourcesLink"></a>
    </nav>
  </header>

  <section class="intro" id="intro">
    <p class="lead" data-i18n="introLead"></p>
    <ol class="steps">
      <li><span class="num-badge">1</span><div><b data-i18n="step1Title"></b><p data-i18n="step1Text"></p>
</div></li>
      <li><span class="num-badge">2</span><div><b data-i18n="step2Title"></b><p data-i18n="step2Text"></p>
        <a class="cta" href="#check" id="intro-check" data-i18n="step2Button"></a></div></li>
      <li><span class="num-badge">3</span><div><b data-i18n="step3Title"></b><p data-i18n="step3Text"></p></div></li>
    </ol>
    <div class="standards">
      <b data-i18n="stdTitle"></b>
      <p data-i18n="stdIntro"></p>
      <dl>
        <dt data-i18n="layerWosis"></dt><dd data-i18n="stdWosis"></dd>
        <dt data-i18n="layerOsd"></dt><dd data-i18n="stdOsd"></dd>
        <dt data-i18n="layerLdd"></dt><dd data-i18n="stdLdd"></dd>
        <dt data-i18n="stdDindeeTerm"></dt><dd data-i18n="stdDindee"></dd>
        <dt data-i18n="stdMapsTerm"></dt><dd data-i18n="stdMaps"></dd>
      </dl>
      <p data-i18n="stdHow"></p>
    </div>
    <details class="glossary">
      <summary data-i18n="glossaryTitle"></summary>
      <dl>
        <dt>pH</dt><dd data-i18n="gPh"></dd>
        <dt>OM</dt><dd data-i18n="gOm"></dd>
        <dt>P</dt><dd data-i18n="gP"></dd>
        <dt>K</dt><dd data-i18n="gK"></dd>
        <dt>EC</dt><dd data-i18n="gEc"></dd>
        <dt data-i18n="gTextureTerm"></dt><dd data-i18n="gTexture"></dd>
      </dl>
    </details>
    <p class="muted small" data-i18n="introCaution"></p>
  </section>

  <section class="stats" id="stats"></section>

  <main class="layout">
    <aside class="filters">
      <h2 data-i18n="layers"></h2>
      <p class="info" data-i18n="layersNote"></p>
      <label class="row-label"><span data-i18n="colorBy"></span><select id="color-by"></select></label>

      <div class="layer">
        <label class="check"><input id="l-wosis" type="checkbox" checked> <b data-i18n="layerWosis"></b> <span class="badge badge-used" data-i18n="measured"></span></label>
        <p class="info" id="wosis-info"></p>
      </div>
      <div class="layer">
        <div class="layer-row">
          <label class="check"><input id="l-osd" type="checkbox" checked> <b data-i18n="layerOsd"></b></label>
          <select id="osd-year" class="mini" data-i18n-title="osdYear"></select>
        </div>
        <p class="info" id="osd-info"></p>
      </div>
      <div class="layer">
        <label class="check"><input id="l-ldd" type="checkbox"> <b data-i18n="layerLdd"></b> <span class="badge badge-planned" data-i18n="classesOnly"></span></label>
        <p class="info" id="ldd-info"></p>
        <details>
          <summary data-i18n="filters"></summary>
          <div class="grid2">
            <label><span data-i18n="province"></span><select id="f-province"><option value="" data-i18n="all"></option></select></label>
            <label><span>pH</span><select id="f-ph"><option value="" data-i18n="all"></option></select></label>
          </div>
          <div class="grid3">
            <label><span>OM</span><select id="f-om"><option value="" data-i18n="all"></option></select></label>
            <label><span>P</span><select id="f-p"><option value="" data-i18n="all"></option></select></label>
            <label><span>K</span><select id="f-k"><option value="" data-i18n="all"></option></select></label>
          </div>
          <div class="grid2">
            <label><span data-i18n="yearFrom"></span><input id="f-from" type="number" min="1990" max="2100" placeholder="CE"></label>
            <label><span data-i18n="yearTo"></span><input id="f-to" type="number" min="1990" max="2100" placeholder="CE"></label>
          </div>
          <label><span data-i18n="qa"></span><select id="f-qa"></select></label>
          <label class="check"><input id="f-new" type="checkbox"> <span data-i18n="onlyNew"></span></label>
          <button id="f-reset" type="button" data-i18n="reset"></button>
        </details>
      </div>

      <h3 data-i18n="areaLayers"></h3>
      <div class="grid2">
        <label class="check"><input id="l-prov" type="checkbox" checked> <span data-i18n="layerProvince"></span></label>
        <label class="check"><input id="l-admin" type="checkbox"> <span data-i18n="layerAdmin"></span></label>
      </div>
      <p class="info" id="admin-info"></p>
      <div class="layer-row">
        <label class="check"><input id="l-lc" type="checkbox"> <span data-i18n="layerLandcover"></span></label>
        <span id="lc-opts" hidden><select id="lc-year" class="mini" data-i18n-title="lcYear"></select></span>
      </div>
      <p class="info" id="lc-status"></p>
      <label class="row-label"><span data-i18n="rasterLayer"></span><select id="raster"></select></label>
      <label class="row-label" id="raster-opts" hidden><span data-i18n="opacity"></span><input id="raster-opacity" type="range" min="0.2" max="1" step="0.1" value="0.7"></label>
    </aside>
    <div id="map"></div>
    <div class="map-legend" id="map-legend">
      <details id="map-legend-details" open>
        <summary data-i18n="mapLegend"></summary>
        <section><b id="pt-legend-title"></b><ul class="legend" id="legend"></ul></section>
        <div id="ml-extra"></div>
      </details>
    </div>
  </main>

  <section class="panel" id="check">
    <h2 data-i18n="checkTitle"></h2>
    <p class="muted small" data-i18n="checkIntro"></p>
    <div class="check-form">
      <button type="button" id="check-pick" aria-pressed="false" data-i18n="checkPick"></button>
      <button type="button" id="check-me" data-i18n="checkMe"></button>
      <label><span data-i18n="checkLat"></span><input id="check-lat" inputmode="decimal" placeholder="16.68 หรือ 16.68, 102.86"></label>
      <label><span data-i18n="checkLon"></span><input id="check-lon" inputmode="decimal" placeholder="102.86"></label>
      <label><span data-i18n="checkRadius"></span><select id="check-radius">
        <option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="25">25 km</option>
      </select></label>
      <button type="button" id="check-go" class="primary" data-i18n="checkGo"></button>
    </div>
    <p class="muted small" id="check-msg" aria-live="polite"></p>
    <div id="check-result"></div>
  </section>


  <section class="panel">
    <h2 data-i18n="history"></h2>
    <p class="muted small" data-i18n="historyNote"></p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-i18n="runDate"></th><th data-i18n="total"></th><th data-i18n="added"></th>
          <th data-i18n="removed"></th><th data-i18n="modified"></th><th data-i18n="pending"></th>
        </tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </section>

  <section class="panel small">
    <h2 data-i18n="aboutDates"></h2>
    <ul class="dates-help">
      <li><b data-i18n="layerWosis"></b> — <span data-i18n="dWosis"></span></li>
      <li><b data-i18n="layerOsd"></b> — <span data-i18n="dOsd"></span></li>
      <li><b data-i18n="layerLdd"></b> — <span data-i18n="dLdd"></span>
        <ul>
          <li><b data-i18n="surveyDate"></b> — <span data-i18n="surveyDateHelp"></span></li>
          <li><b data-i18n="firstSeen"></b> — <span data-i18n="firstSeenHelp"></span></li>
          <li><b data-i18n="lastSeen"></b> — <span data-i18n="lastSeenHelp"></span></li>
          <li><b data-i18n="detailFetched"></b> — <span data-i18n="detailFetchedHelp"></span></li>
        </ul></li>
      <li><b data-i18n="checkDindee"></b> — <span data-i18n="dDindee"></span></li>
      <li><b data-i18n="dMapsTerm"></b> — <span data-i18n="dMaps"></span></li>
      <li><b data-i18n="dUpdateTerm"></b> — <span data-i18n="dUpdate"></span></li>
    </ul>
  </section>

  <footer class="muted small">
    <div class="foot-org"><span class="logos"><img src="img/logo-ku.png" alt="มหาวิทยาลัยเกษตรศาสตร์ (Kasetsart University)" width="31" height="40"><img src="img/logo-sis.png" alt="วิทยาลัยบูรณาการศาสตร์ (School of Integrated Science)" width="117" height="40"></span><span data-i18n="madeBy"></span></div>
    <p><span data-i18n="footer"></span> · <a href="sources.html" data-i18n="sourcesLink"></a></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="i18n.js?v=dev"></script>
  <script src="scales.js?v=dev"></script>
  <script src="app.js?v=dev"></script>
  <script src="areas.js?v=dev"></script>
  <script src="check.js?v=dev"></script>
</body>
</html>
