<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Sources</title>
  <meta name="description" content="All data sources used by the Thai Soil Survey Database, with licences and update schedules.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <header class="top">
    <div>
      <p class="sub"><a href="index.html" data-i18n="backToMap"></a></p>
      <h1 data-i18n="sourcesTitle"></h1>
      <p class="sub" data-i18n="sourcesIntro"></p>
    </div>
    <nav class="downloads">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </nav>
  </header>

  <div class="tabs" id="tabs"></div>
  <section class="cards" id="cards"></section>

  <section class="panel small">
    <h2 data-i18n="citeTitle"></h2>
    <p data-i18n="citeText"></p>
  </section>

  <footer class="muted small" data-i18n="footer"></footer>

  <script src="i18n.js?v=dev"></script>
  <script src="sources.js?v=dev"></script>
  <script>
    let lang = (() => {
      const q = new URLSearchParams(location.search).get("lang");
      if (q === "th" || q === "en") return q;
      try { const s = localStorage.getItem("lang"); if (s === "th" || s === "en") return s; } catch (e) {}
      return (navigator.language || "").startsWith("th") ? "th" : "en";
    })();
    let filter = "";
    const t = (k) => I18N[lang][k] ?? k;
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function render() {
      document.documentElement.lang = lang;
      document.title = t("sourcesTitle");
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
      document.querySelector("a[href='index.html']").textContent = "← " + t("backToMap");

      const statuses = ["", "used", "planned", "basemap"];
      document.getElementById("tabs").innerHTML = statuses.map((s) => {
        const n = s ? SOURCES.filter((x) => x.status === s).length : SOURCES.length;
        return `<button type="button" data-status="${s}" aria-pressed="${s === filter}">${esc(s ? t("status")[s] : t("all"))} (${n})</button>`;
      }).join("");

      const rows = [["type", "type"], ["fields", "fields"], ["access", "access"], ["license", "license"], ["update", "updateFreq"], ["note", "note"]];
      document.getElementById("cards").innerHTML = SOURCES.filter((s) => !filter || s.status === filter).map((s) => `
        <article class="card" id="${s.id}">
          <div class="card-head">
            <h2><a href="${s.url}" target="_blank" rel="noopener">${esc(s.name[lang])}</a></h2>
            <span class="badge badge-${s.status}">${esc(t("status")[s.status])}</span>
          </div>
          <p class="muted">${esc(s.org[lang])}</p>
          <dl>${rows.filter(([k]) => s[k][lang]).map(([k, label]) => `<dt>${esc(t(label))}</dt><dd>${esc(s[k][lang])}</dd>`).join("")}</dl>
        </article>`).join("");
    }

    document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
      lang = b.dataset.lang;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      render();
    }));
    document.getElementById("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-status]");
      if (b) { filter = b.dataset.status; render(); }
    });
    render();
  </script>
</body>
</html>
