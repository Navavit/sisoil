name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # ให้ได้ข้อมูลล่าสุดที่เพิ่ง commit จาก update-data

      - name: สร้างไฟล์สำหรับฟังก์ชันตรวจดินจากพิกัด
        run: python3 scripts/build_web.py

      - name: รวมเว็บกับข้อมูล
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
